[build]
  publish = "."
  command = "echo 'static site - no build'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/syllabus"
  to = "/courses.html#syllabus"
  status = 301

[[redirects]]
  from = "/counselling"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
